<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David learns to code</title>
<meta name="description" content="I like figuring out how things work — and writing down what I find.">
<link rel="alternate" hreflang="en" href="https://iamslash.github.io/en/">
<link rel="alternate" hreflang="ko" href="https://iamslash.github.io/ko/">
<link rel="alternate" hreflang="x-default" href="https://iamslash.github.io/">
<style>
  :root {
    --bg:        #0e1013;
    --bg-soft:   #161a1f;
    --line:      #262c34;
    --fg:        #e6e9ee;
    --fg-dim:    #8b95a3;
    --fg-faint:  #59626f;
    --accent:    #6ea8fe;
    --glow:      rgba(110,168,254,.14);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#fbfbfc; --bg-soft:#fff; --line:#e3e6ea; --fg:#1a1d21;
      --fg-dim:#5b6472; --fg-faint:#98a1ad; --accent:#2563eb;
      --glow: rgba(37,99,235,.10);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    position: relative;
    overflow-x: hidden;
  }

  /* faint grid, masked to a centre glow */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: .25;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 45%, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 45%, #000 20%, transparent 75%);
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed; left: 50%; top: 38%;
    width: min(820px, 120vw); aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--glow) 0%, transparent 62%);
    pointer-events: none;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 560px;
    text-align: center;
    animation: rise .7s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  .mark {
    font-family: var(--mono);
    font-size: clamp(1.35rem, 6.2vw, 2.5rem);
    letter-spacing: -.02em;
    line-height: 1.25;
    margin: 0;
    font-weight: 500;
    overflow-wrap: break-word;
  }
  .caret {
    display: inline-block;
    width: .58ch; height: 1.02em;
    margin-left: .12em;
    background: var(--accent);
    vertical-align: -.14em;
    animation: blink 1.15s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .tagline {
    margin: 1.15rem 0 0;
    color: var(--fg-dim);
    font-size: 1.02rem;
    line-height: 1.55;
  }
  nav {
    margin-top: 2.75rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .85rem;
  }
  @media (max-width: 460px) { nav { grid-template-columns: 1fr; } }

  nav a {
    display: block;
    padding: 1.15rem 1.25rem;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    text-decoration: none;
    color: var(--fg);
    text-align: left;
    transition: border-color .18s ease, transform .18s ease, background .18s ease;
  }
  nav a:hover, nav a:focus-visible {
    border-color: var(--accent);
    transform: translateY(-2px);
    background: var(--bg-soft);
    outline: none;
  }
  nav .lang {
    font-family: var(--mono);
    font-size: .74rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }
  nav .name {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    margin-top: .3rem;
    font-size: 1.12rem;
  }
  nav .arrow { color: var(--fg-faint); transition: transform .18s ease, color .18s ease; }
  nav a:hover .arrow { color: var(--accent); transform: translateX(3px); }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .caret { animation: none; }
    nav a, nav .arrow { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <h1 class="mark">David learns to code<span class="caret" aria-hidden="true"></span></h1>

    <p class="tagline">
      I like figuring out how things work — and writing down what I find.
    </p>

    <nav>
      <a href="./en/" hreflang="en">
        <span class="lang">English</span>
        <span class="name">Read <span class="arrow" aria-hidden="true">→</span></span>
      </a>
      <a href="./ko/" hreflang="ko">
        <span class="lang">Korean</span>
        <span class="name">Read <span class="arrow" aria-hidden="true">→</span></span>
      </a>
    </nav>
  </main>
</body>
</html>
