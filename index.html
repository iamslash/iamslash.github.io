<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iamslash</title>
<link rel="alternate" hreflang="en" href="https://iamslash.github.io/en/">
<link rel="alternate" hreflang="ko" href="https://iamslash.github.io/ko/">
<link rel="alternate" hreflang="x-default" href="https://iamslash.github.io/">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:2rem;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:#fff; color:#333; }
  h1 { margin:0; font-weight:400; font-size:2.5rem; letter-spacing:.02em; color:#888; }
  nav { display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; }
  a { display:block; padding:.85rem 2rem; border:1px solid #ddd; border-radius:6px;
      text-decoration:none; color:#333; font-size:1.05rem; }
  a:hover { border-color:#999; }
  @media (prefers-color-scheme: dark) {
    body { background:#1c1e22; color:#ddd; }
    h1 { color:#aaa; }
    a { border-color:#3a3d43; color:#ddd; }
    a:hover { border-color:#666; }
  }
</style>
</head>
<body>
  <h1>iamslash</h1>
  <nav>
    <a href="./en/" hreflang="en">English</a>
    <a href="./ko/" hreflang="ko">한국어</a>
  </nav>
</body>
</html>
